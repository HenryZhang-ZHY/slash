name: Fake CD Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type to simulate
        required: true
        type: choice
        options:
          - preview
          - prerelease
      slash_run_id: { required: false }
      slash_pr_number: { required: false }
      slash_head_sha: { required: false }
      slash_actor: { required: false }
      slash_actor_id: { required: false }

jobs:
  fake-cd:
    runs-on: ubuntu-slim
    steps:
      - name: Simulate CD release
        env:
          ACTOR: ${{ inputs.slash_actor }}
          PR_NUMBER: ${{ inputs.slash_pr_number }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          echo "Starting fake ${RELEASE_TYPE} release for PR #${PR_NUMBER} requested by ${ACTOR}"
          echo "Building fake release artifacts..."
          echo "Fake ${RELEASE_TYPE} release completed."