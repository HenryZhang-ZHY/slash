[workspace]
resolver = "3"
members = [
    "crates/slash-command",
    "crates/slash-config",
    "crates/slash-core",
    "crates/slash-github",
    "crates/slash-server",
    "crates/slash-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/HenryZhang-ZHY/slash"

[workspace.dependencies]
slash-command = { path = "crates/slash-command" }
slash-config = { path = "crates/slash-config" }
slash-core = { path = "crates/slash-core" }
slash-github = { path = "crates/slash-github" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The parsing surfaces take untrusted input; a panic there is a denial of
# service on a shared multi-tenant process (spec §9).
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
